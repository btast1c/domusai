<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#397eee"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#397eee;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#397eee;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="80" rx="12" fill="url(#bg)"/>
  <line x1="40" y1="64" x2="560" y2="64" stroke="url(#line)" stroke-width="1"/>
  <circle cx="50" cy="34" r="10" fill="none" stroke="#397eee" stroke-width="1.5" opacity="0.7"/>
  <line x1="57" y1="41" x2="64" y2="48" stroke="#397eee" stroke-width="2" opacity="0.7"/>
  <circle cx="46" cy="30" r="2" fill="#93c5fd" opacity="0.6"/>
  <line x1="46" y1="26" x2="46" y2="28" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
  <line x1="42" y1="30" x2="44" y2="30" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
  <text x="80" y="44" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="url(#text)" letter-spacing="1" filter="url(#glow)">Find Your Room with AI</text>
</svg>
