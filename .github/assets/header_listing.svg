<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#397eee"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#397eee;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#397eee;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="80" rx="12" fill="url(#bg)"/>
  <line x1="40" y1="64" x2="560" y2="64" stroke="url(#line)" stroke-width="1"/>
  <!-- Clipboard/list icon -->
  <rect x="42" y="22" width="20" height="26" rx="3" fill="none" stroke="#397eee" stroke-width="1.5" opacity="0.7"/>
  <rect x="48" y="18" width="8" height="6" rx="1" fill="#60a5fa" opacity="0.5"/>
  <line x1="48" y1="31" x2="56" y2="31" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="48" y1="36" x2="56" y2="36" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <line x1="48" y1="41" x2="56" y2="41" stroke="#93c5fd" stroke-width="1.5" opacity="0.5"/>
  <text x="80" y="44" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="url(#text)" letter-spacing="1" filter="url(#glow)">List a Room in Minutes</text>
</svg>
